# Created with AI assistance by Claude Code (model: Claude Opus 5.5, model id: claude-opus-5-5, Anthropic).
#
# Ankaios manifest for the AutoSD target: every container of the architecture in
# Docs/Static_View.png. The localhost/*:dev images are produced by
# deploy/build-images.sh and must be loaded on the target before this is applied.
#
# Applied to the QEMU image with deploy/deploy-to-autosd.sh: all five
# workloads reach Running(Ok). Verified there with the real board:
# board -> MQTT -> publisher -> Guardian -> DFM -> OpenSOVD gateway.
#
# The target must provide (lost on reboot unless recreated, /tmp is a tmpfs):
#   /tmp/iceoryx2                 iceoryx2 discovery files, shared by guardian, dfm and opensovd-gateway
#   /var/lib/fevengers/catalogs   copy of the repo's catalogs/ folder
#   /var/lib/fevengers/webui      copy of opensovd-gateway-dfm/webui/ (fault monitor page)
#
# Data path:
#   AZ3166 --MQTT--> mqtt-broker --> vss-publisher --uProtocol/Zenoh--> guardian
#   guardian --iceoryx2--> dfm <--iceoryx2 "dfm/query"-- opensovd-gateway <--HTTP :7690-- tester
apiVersion: v1
workloads:
  # Container 1 (Input Handler), part 1: broker the AZ3166 publishes to.
  mqtt-broker:
    runtime: podman
    agent: agent_A
    restartPolicy: ALWAYS
    runtimeConfig: |
      image: docker.io/library/eclipse-mosquitto:2
      commandOptions: ["--net=host"]
      commandArgs: ["/usr/sbin/mosquitto", "-c", "/mosquitto-no-auth.conf"]

  # Container 1 (Input Handler), part 2: MQTT -> VSS -> uProtocol.
  vss-publisher:
    runtime: podman
    agent: agent_A
    restartPolicy: ALWAYS
    dependencies:
      mqtt-broker: ADD_COND_RUNNING
    runtimeConfig: |
      image: localhost/vss-uprotocol-publisher:dev
      commandOptions: ["--net=host"]

  # Container 2: Battery Thermal Guardian. Host network so Zenoh scouting
  # finds the publisher. It reports its catalog faults to the DFM with
  # fault-lib over iceoryx2 (enabled by --dfm-catalog), so it shares the dfm
  # workload's IPC options and mounts, runs as the same user (root) and reads
  # the same catalog. It starts without the DFM too and connects once it is up.
  guardian:
    runtime: podman
    agent: agent_A
    restartPolicy: ALWAYS
    runtimeConfig: |
      image: localhost/battery-thermal-guardian:dev
      commandOptions:
        - "--net=host"
        - "--ipc=host"
        - "--pid=host"
        - "--user=0:0"
        - "--security-opt=label=disable"
        - "--volume=/dev/shm:/dev/shm"
        - "--volume=/tmp/iceoryx2:/tmp/iceoryx2"
        - "--volume=/var/lib/fevengers/catalogs:/catalogs:ro"
      commandArgs:
        - "--config"
        - "/etc/guardian/guardian.toml"
        - "--dfm-catalog"
        - "/catalogs/battery_guardian_catalog.json"

  # Container 3: Diagnostic Fault Manager. iceoryx2 is shared-memory IPC, so
  # dfm, opensovd-gateway and every reporter share the host IPC and PID namespaces,
  # /dev/shm and /tmp/iceoryx2. label=disable: AutoSD runs SELinux enforcing.
  dfm:
    runtime: podman
    agent: agent_A
    restartPolicy: ALWAYS
    runtimeConfig: |
      image: localhost/dfm:dev
      commandOptions:
        - "--ipc=host"
        - "--pid=host"
        - "--security-opt=label=disable"
        - "--volume=/dev/shm:/dev/shm"
        - "--volume=/tmp/iceoryx2:/tmp/iceoryx2"
        - "--volume=/var/lib/fevengers/catalogs:/catalogs:ro"
        - "--volume=dfm-store:/store"

  # Container 4: OpenSOVD gateway. Serves the DFM's faults on the standard
  # SOVD path /sovd/v1/apps/battery/faults and the fault monitor page on /ui/.
  # Port 7690 is the one of the architecture diagram; autosd.sh forwards it to
  # the host. "--dfm-fault-app battery" must equal the id of the fault catalog.
  # It replaced the standalone SOVD fault bridge, which is no longer in the repository.
  opensovd-gateway:
    runtime: podman
    agent: agent_A
    restartPolicy: ALWAYS
    dependencies:
      dfm: ADD_COND_RUNNING
    runtimeConfig: |
      image: localhost/opensovd-gateway-dfm:dev
      commandOptions:
        - "--net=host"
        - "--ipc=host"
        - "--pid=host"
        - "--security-opt=label=disable"
        - "--volume=/dev/shm:/dev/shm"
        - "--volume=/tmp/iceoryx2:/tmp/iceoryx2"
        - "--volume=/var/lib/fevengers/webui:/webui:ro"
      commandArgs: ["--dfm-fault-app", "battery", "--serve-dir", "/ui:/webui"]
