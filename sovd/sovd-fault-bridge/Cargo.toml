# Created with AI assistance (Claude Opus 5.5, Anthropic).
#
# SOVD fault bridge: exposes faults held by the Eclipse OpenSOVD
# Diagnostic Fault Manager (DFM) over the SOVD REST /faults API.

[package]
name = "sovd-fault-bridge"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
# DFM query client (Iceoryx2DfmQuery). Pinned to the commit that added the DFM (PR #7).
dfm_lib = { git = "https://github.com/eclipse-opensovd/fault-lib.git", rev = "12dac502616701734f90a61edca1326ae2ac6506" }

axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.5", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
