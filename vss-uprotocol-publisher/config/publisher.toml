# VSS uProtocol Publisher configuration. Every value shown is the default;
# delete what you do not want to change.

[mqtt]
host = "localhost"
port = 1883
topic = "FEVengers_MQTT/telemetry" # topic the AZ3166 publishes on
client_id = "vss-uprotocol-publisher"
keep_alive_s = 10

[mapping]
vss_path = "Vehicle.Powertrain.TractionBattery.Temperature.Max"
temperature_field = "temperature_degC"   # JSON key of the temperature in the board's message
counter_field = "counter"                # JSON key of the rolling counter (0..255)

[uprotocol]
authority = "vehicle"
entity_id = 0x8001                 # Guardian subscribes to //*/8001/1/8001
entity_version = 1
resource_id = 0x8001
# zenoh_config = "config/zenoh.json5"
