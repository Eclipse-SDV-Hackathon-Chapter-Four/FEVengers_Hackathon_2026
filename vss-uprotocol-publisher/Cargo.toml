[package]
name = "vss-uprotocol-publisher"
version = "0.1.0"
edition = "2021"
description = "Maps AZ3166 MQTT temperature readings to VSS and publishes them over uProtocol"
license = "EPL-2.0 AND CC0-1.0"

[lib]
name = "vss_publisher"
path = "src/lib.rs"

[[bin]]
name = "vss-uprotocol-publisher"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rumqttc = { version = "0.25", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
up-rust = { version = "0.9.0", default-features = false }
up-transport-zenoh = "0.9.1"

[dev-dependencies]
async-trait = "0.1"
up-rust = { version = "0.9.0", default-features = false, features = ["util"] }
