[package]
name = "battery-thermal-guardian"
version = "0.1.0"
edition = "2021"
description = "Battery Thermal Guardian: EV thermal-runaway early warning over uProtocol"
license = "EPL-2.0 AND CC0-1.0"

[lib]
name = "guardian"
path = "src/lib.rs"

[[bin]]
name = "guardian"
path = "src/main.rs"

[[bin]]
name = "vss-sim"
path = "src/bin/vss_sim.rs"

[[bin]]
name = "guardian-monitor"
path = "src/bin/guardian_monitor.rs"

[dependencies]
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
up-rust = { version = "0.9.0", default-features = false }
up-transport-zenoh = "0.9.1"
# DFM reporting (Eclipse OpenSOVD fault-lib, iceoryx2 IPC), see src/dfm.rs.
# `common` is the fault-lib crate with the shared types (FaultId, LifecycleStage, ...).
fault_lib = { git = "https://github.com/eclipse-opensovd/fault-lib.git", rev = "12dac502616701734f90a61edca1326ae2ac6506" }
fault_common = { package = "common", git = "https://github.com/eclipse-opensovd/fault-lib.git", rev = "12dac502616701734f90a61edca1326ae2ac6506" }

[dev-dependencies]
up-rust = { version = "0.9.0", default-features = false, features = ["util"] }
