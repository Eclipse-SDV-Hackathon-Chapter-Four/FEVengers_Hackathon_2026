# Battery Thermal Guardian configuration. Every value shown is the default;
# delete what you do not want to change.

[uprotocol]
authority = "vehicle"
entity_id = 0x8002                 # Guardian uEntity
entity_version = 1
input_topic = "//*/8001/1/8001"    # VSS uProtocol publisher topic
vss_path = "Vehicle.Powertrain.TractionBattery.Temperature.Max"
heartbeat_period_ms = 1000
tick_period_ms = 100
# zenoh_config = "config/zenoh.json5"

[signal]
min_c = -40.0
max_c = 150.0
stale_timeout_ms = 3000
max_latency_ms = 1000
max_rate_c_per_s = 10.0
spike_confirm_samples = 2
stuck_window_ms = 30000            # 0 disables stuck detection
stuck_epsilon_c = 0.0
heal_samples = 5
trust_samples = 3
counter_modulus = 256              # device rolling counter counts 0..255, then 0 again

[thermal]
warning_c = 55.0
critical_c = 65.0
hysteresis_c = 3.0
warning_rate_c_per_s = 0.5
trend_window_ms = 10000
critical_persist_ms = 2000
mitigation_timeout_ms = 30000
recovery_hold_ms = 5000

[dfm]
# DFM fault catalog, the same file the DFM loads. Not set = no DFM reporting
# (faults are still published over uProtocol). --dfm-catalog sets it too.
# catalog = "dfm-container/battery_guardian_catalog.json"
retry_period_ms = 5000             # reconnect period while the DFM is not reachable
